set -g prefix C-b
bind C-b send-prefix
set -g history-limit 100000
setw -g mode-keys vi
set -g status-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g bell-action none
set -s escape-time 0
set -g focus-events on
set -g allow-rename off
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",screen-256color:Tc,xterm-256color:Tc"

# All bindings require Ctrl+b first.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H split-window -h -c "#{pane_current_path}"
bind J split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r command-prompt -I '#W' "rename-window '%%'"
bind R command-prompt -I '#S' "rename-session '%%'"
bind f resize-pane -Z
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g status-style 'fg=#a0a0a0,bg=default'
set -g status-left-length 60
set -g status-left '#[fg=#ffc799]#H #[fg=#a0a0a0][#S] '
set -g status-right ''
setw -g window-status-current-format '#[fg=#ffc799]#I:#W#{?window_zoomed_flag, [Z],}'
setw -g window-status-format '#[fg=#a0a0a0]#I:#W '
set -g pane-border-style 'fg=#303030'
set -g pane-active-border-style 'fg=#ffc799'
